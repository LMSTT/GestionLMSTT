name: Export ponctuel des migrations
on:
  push:
    paths: [".github/workflows/tmp-export-migrations.yml"]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          curl -sf -X POST "https://ttkbmvkfhagzgrgeslhy.supabase.co/rest/v1/rpc/api_tmp_migrations" \
            -H "apikey: sb_publishable_O9KYePQQSLC48vFn0E0Djw_sGtY_Nb5" -H "Content-Type: application/json" \
            -d '{"p_cle":"xport-7Qm2Lw9Rt4Ka"}' -o m.json
          mkdir -p supabase/migrations
          jq -c '.[]' m.json | while read -r row; do
            v=$(jq -r .version <<<"$row"); n=$(jq -r .name <<<"$row")
            jq -r .sql <<<"$row" > "supabase/migrations/${v}_${n}.sql"
            echo ";" >> "supabase/migrations/${v}_${n}.sql"
          done
          rm m.json
          ls supabase/migrations | wc -l
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Migrations Supabase existantes versionnées (export depuis l'historique)" || true
          git push
