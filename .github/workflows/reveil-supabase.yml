name: Réveil base Supabase
# Interroge la base tous les 3 jours pour éviter la mise en pause du projet gratuit (7 jours sans activité).
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -sf -X POST "https://ttkbmvkfhagzgrgeslhy.supabase.co/rest/v1/rpc/api_ping" \
            -H "apikey: sb_publishable_O9KYePQQSLC48vFn0E0Djw_sGtY_Nb5" \
            -H "Content-Type: application/json" -d '{}'
